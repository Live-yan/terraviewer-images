name: Materialize audited item repairs
on:
  push:
    branches: [fix/item-coverage-8255d346]
    paths: ['data/**', 'scripts/item_coverage.py', 'scripts/test_item_coverage.py', '.github/workflows/materialize-item-repairs.yml']
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'Live-yan/terraviewer-images' && github.ref == 'refs/heads/fix/item-coverage-8255d346'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/item-coverage-8255d346
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate only audited images and verify every supported item
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/item_coverage.py --write
          python scripts/item_coverage.py --check
          python -m unittest discover -s scripts -p 'test_item_coverage.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add items index/items-1.4.5.8.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: fill 62 texture aliases and 49 new item icons for IDs 1-6195'
            git push origin HEAD:refs/heads/fix/item-coverage-8255d346
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-item-coverage
          path: |
            reports/item-coverage.json
            index/items-1.4.5.8.json
