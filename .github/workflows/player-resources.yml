name: Versioned public resources
on:
  push:
    branches: [feat/versioned-shared-assets]
    paths: ['sources/player-choices-v1/**', 'scripts/build-player-choices.py', '.github/workflows/player-resources.yml']
  pull_request:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild and validate public PNGs
        run: |
          python scripts/build-player-choices.py
          python scripts/build-player-choices.py --check
      - name: Publish only generated resources on the isolated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/versioned-shared-assets'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player/1.4.5.8/choices-v1 index/resources-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish verified player previews and shared resource manifest'
            git push origin HEAD:refs/heads/feat/versioned-shared-assets
          fi
      - name: Verify pull request committed the exact generated outputs
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- player/1.4.5.8/choices-v1 index/resources-v1.json
      - uses: actions/upload-artifact@v7
        with:
          name: public-resource-manifests
          path: |
            index/resources-v1.json
            player/1.4.5.8/choices-v1/manifest.json
